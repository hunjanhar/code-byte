apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: code-byte-hpa
  namespace: code-byte-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: code-byte-deployment
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
